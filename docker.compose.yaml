services:
  # ============================================================================
  # 1. MongoDB Database
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: voicesight-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - voicesight-network

  # ============================================================================
  # 2. Apache Kafka Broker (Official Base Image with KRaft - No ZooKeeper needed)
  # ============================================================================
  kafka:
    image: apache/kafka:latest
    container_name: voicesight-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft Settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dual Listeners: Internal Docker (kafka:9092) and Host External (localhost:9094)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Topic & Partition Configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - voicesight-network

  # ============================================================================
  # 3. Dedicated Event Processing Microservice (Kafka Consumer Worker)
  # ============================================================================
  event-processing-service:
    build:
      context: ./event-processing-service
      dockerfile: Dockerfile
    container_name: voicesight-event-processor
    restart: unless-stopped
    depends_on:
      - kafka
      - mongodb
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CONSUMER_GROUP_ID=voicesight-transcription-group
      - KAFKA_MEETING_TOPIC=voice-meeting-recordings
      - KAFKA_TRANSCRIPT_TOPIC=voice-transcript-processing
      - MONGO_DB_URI=mongodb://mongodb:27017/voicesight
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - voicesight-network

  # ============================================================================
  # 4. Main VoiceSight FastAPI Server (Shares Kafka Connection via Producer)
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voicesight-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - mongodb
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_MEETING_TOPIC=voice-meeting-recordings
      - MONGO_DB_URI=mongodb://mongodb:27017/voicesight
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID}
      - ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET}
      - ZOOM_REDIRECT_URI=${ZOOM_REDIRECT_URI:-http://localhost:8000/providers/zoom/oauth/callback}
      - ZOOM_WEBHOOK_SECRET_TOKEN=${ZOOM_WEBHOOK_SECRET_TOKEN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_MEET_REDIRECT_URI=${GOOGLE_MEET_REDIRECT_URI:-http://localhost:8000/providers/google-meet/oauth/callback}
      - MS_TEAMS_CLIENT_ID=${MS_TEAMS_CLIENT_ID}
      - MS_TEAMS_CLIENT_SECRET=${MS_TEAMS_CLIENT_SECRET}
      - MS_TEAMS_REDIRECT_URI=${MS_TEAMS_REDIRECT_URI:-http://localhost:8000/providers/teams/oauth/callback}
      - CLIENT_DOMAIN=${CLIENT_DOMAIN:-http://localhost:3000}
      - SERVER_DOMAIN=${SERVER_DOMAIN:-http://localhost:8000}
      - ENV=prod
    networks:
      - voicesight-network

networks:
  voicesight-network:
    driver: bridge

volumes:
  mongo_data:
  kafka_data:
