# This workflow builds and pushes a Docker container to Google Artifact Registry
# and deploys it on Cloud Run when a commit is pushed to the "main" branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Cloud Run (run.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    See https://support.google.com/googleapi/answer/6158841 for enabling APIs.
#
# 2. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    You will need to grant an IAM principal the following permissions:
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Cloud Run Developer (roles/run.developer)
#    See https://cloud.google.com/iam/docs/manage-access-other-resources

# 3. Change the values in the "env" block to match your project.

name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - 'main'
    paths:
      - 'server/**'   # Only trigger if something inside server/ changes
      - '.github/**'

env:
  PROJECT_ID: 'voicesights'
  REGION: 'us-central1'
  SERVICE: 'voicesights-api'
  REGISTRY_TAG: 'app'
  SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  deploy:
    runs-on: 'ubuntu-latest'
    environment: 'github-cloudrun'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      # Confirm secrets exist, comment out after debugging if desired
      - name: Echo secret
        run: |
          echo "SERVICE_ACCOUNT set: ${{ secrets.SERVICE_ACCOUNT != '' }}"
          echo "WORKLOAD_IDENTITY_PROVIDER set: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER != '' }}"

      - id: auth
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          export_environment_variables: true
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: 'Verify authenticated account'
        run: |
          gcloud auth list
          gcloud config list

      - name: 'Configure Docker for Artifact Registry'
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: 'Build and Push Container'
        run: |
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_TAG }}/api:${{ github.sha }}"
          echo "Docker Tag: $DOCKER_TAG"
          docker build --tag "$DOCKER_TAG" -f ./server/Dockerfile.api ./server
     
          docker push "$DOCKER_TAG"

      - id: deploy
        name: 'Deploy to Cloud Run'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REGISTRY_TAG }}/api:${{ github.sha }}'
          allow_unauthenticated: true

      - name: 'Show output'
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
